name: Build UNWRITTEN assets
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'catalog/roster.txt'
      - 'source_overrides/**'
      - 'requirements.txt'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unwritten-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_assets.py
      - run: python tools/build_colossi.py
      - run: python tools/build_player_colossi.py
      - run: python tools/build_aion_motion_final.py
      - run: python tools/validate_assets.py
      - run: python tools/validate_player_colossi.py
      - run: python tools/render_previews.py
      - run: python tools/render_colossi.py
      - run: python tools/render_player_colossi.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blockbench packs skins dist catalog/assets.json docs/previews docs/validation.json docs/colossi-art-report.json docs/player-colossi-report.json docs/aion-art-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build validated UNWRITTEN first-pass assets'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: UNWRITTEN-assets
          path: |
            dist/
            blockbench/
            docs/previews/
